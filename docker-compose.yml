# Runs the calculator API and UI. The frontend's nginx proxies /calculate to
# the backend over the shared network, so the browser stays same-origin.
#
#   docker compose up --build
#
# Frontend: http://localhost:5173  ·  Backend: http://localhost:8080

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    # Start ordering only; nginx re-resolves `backend` per request (see
    # nginx.conf), so a slightly-late backend just yields a transient 502.
    depends_on:
      - backend
