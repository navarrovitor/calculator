# Serves the built SPA and forwards /calculate to the backend container.
# Mirrors the Vite dev proxy (frontend/vite.config.ts) for production.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; the variable in proxy_pass forces per-request
    # re-resolution, so a restarted backend stays reachable.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /calculate {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }
}
