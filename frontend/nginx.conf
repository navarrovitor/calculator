# Serves the built SPA and forwards API calls to the backend container.
# `backend` resolves to the compose service on the shared network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Combined with the variable in proxy_pass below,
    # this makes nginx re-resolve `backend` per request instead of caching the
    # IP at startup — so a recreated backend container stays reachable, and a
    # backend that isn't up yet doesn't abort nginx on boot.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API path the frontend POSTs to (see src/lib/api.ts).
    location /calculate {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
