# Serves the built SPA and forwards API calls to the backend container.
# `backend` resolves to the compose service on the shared network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API path the frontend POSTs to (see src/lib/api.ts).
    location /calculate {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
